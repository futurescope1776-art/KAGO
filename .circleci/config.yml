# setup: true is required — the Chunk harness enters setup state and calls the
# CircleCI pipeline continue API ("Merge and continue"). With setup: false the
# pipeline never enters setup state and that call returns 409.
version: 2.1
setup: true

jobs:
  upload_youtube_short:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install deps
          command: |
            sudo apt-get update -q && sudo apt-get install -y ffmpeg
            pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - run:
          name: Validate video
          command: |
            python - <<'EOF'
            import subprocess, sys, os, json

            result = subprocess.run(
                ['ffprobe', '-v', 'quiet', '-print_format', 'json', '-show_streams', 'video.mp4'],
                capture_output=True, text=True
            )
            if result.returncode != 0:
                print(f"ffprobe failed: {result.stderr}")
                sys.exit(1)

            data = json.loads(result.stdout)
            vstreams = [s for s in data['streams'] if s['codec_type'] == 'video']
            if not vstreams:
                print("No video stream found in video.mp4")
                sys.exit(1)

            s = vstreams[0]
            w, h = s['width'], s['height']
            duration = float(s.get('duration', 0))
            size_mb = os.path.getsize('video.mp4') / 1024 / 1024

            topic = os.getenv('VIDEO_TOPIC', '').lower()
            long_topic = any(k in topic for k in ['tutorial', 'guide', 'explainer', 'deep', 'how to'])
            short_topic = any(k in topic for k in ['news', 'quick', 'tip'])
            max_dur = 120 if (long_topic or not short_topic) else 60

            errors = []
            if h <= w:
                errors.append(f"Not vertical: {w}x{h} (height must exceed width)")
            if w < 720 or h < 1280:
                errors.append(f"Resolution too small: {w}x{h} (min 720x1280)")
            if duration < 30:
                errors.append(f"Too short: {duration:.1f}s (min 30s)")
            if duration > max_dur:
                errors.append(f"Too long: {duration:.1f}s (max {max_dur}s for this VIDEO_TOPIC)")
            if size_mb > 100:
                errors.append(f"File too large: {size_mb:.1f}MB (max 100MB)")

            if errors:
                for e in errors:
                    print(f"FAIL: {e}")
                sys.exit(1)

            print(f"OK: {w}x{h}, {duration:.1f}s, {size_mb:.1f}MB")
            EOF
      - run:
          name: Upload to YouTube
          command: python upload_youtube.py

workflows:
  main_workflow:
    jobs:
      - upload_youtube_short:
          context: ai-social
          filters:
            branches:
              only:
                - main
                - chunk/fix-setup-pipeline-flag
