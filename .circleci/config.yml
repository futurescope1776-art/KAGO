# Note on setup: false: With setup disabled the pipeline runs main_workflow directly on push — no setup-state continuation is attempted, so the 409 "Pipeline is not in setup state" error from the Chunk harness "Merge and continue" step will not occur. The tradeoff is that Chunk-driven dynamic config continuation will not work on this branch; if that's needed later, setup: true must be restored.
version: 2.1
setup: false

jobs:
  upload_youtube_short:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install YouTube deps
          command: |
            pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - run:
          name: Upload YouTube Short
          command: |
            if [ -f "upload_youtube.py" ]; then
              python upload_youtube.py
            elif [ -f "scripts/upload_youtube.py" ]; then
              python scripts/upload_youtube.py
            else
              echo "Checking for YouTube script..."
              find . -name "*youtube*.py" -type f
              python $(find . -name "*youtube*.py" | head -1)
            fi

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="youtube-production" \
              --component-name="future-work-money-shorts" \
              --target-version="${CIRCLE_SHA1}"
      - run:
          name: Update a deploy to SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Update planned deploy to FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

workflows:
  version: 2
  main_workflow:
    jobs:
      - upload_youtube_short:
          context: ai-social
          filters:
            branches:
              only:
                - main
                - chunk/fix-setup-pipeline-flag
      - deploy:
          filters:
            branches:
              only:
                - main
                - chunk/fix-setup-pipeline-flag
